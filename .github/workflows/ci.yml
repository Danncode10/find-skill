name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        
    - name: Run Tests
      run: |
        python -m unittest discover tests/ -v
